<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>冒険者ギルド2 動作診断</title><style>body{background:#101924;color:#f5f7fa;font:18px -apple-system,system-ui,sans-serif;padding:22px;line-height:1.6}button,input{font:inherit;padding:14px;border-radius:12px;margin:8px 0;width:100%;box-sizing:border-box}button{background:#25486a;color:white;border:1px solid #7191aa}input{background:#fff;color:#111}.panel{background:#1e2b3b;border-radius:14px;padding:15px;margin:15px 0}.ok{color:#86e9ac}.bad{color:#ffd277}pre{white-space:pre-wrap;word-break:break-word;font-size:14px}</style></head><body><h2>冒険者ギルド2・iPhone動作診断</h2><div class="panel"><div>① HTML表示：<span class="ok">成功</span></div><div>② JavaScript実行：<b id="jsStatus" class="bad">未実行</b></div><div>③ ページ読み込み：<b id="loadStatus" class="bad">未確認</b></div></div><div class="panel"><button id="testButton" onclick="window.testClick && window.testClick()">ボタン動作テスト</button><p id="clickResult">押した結果：まだ押されていません</p><label>数字を変えてみる</label><input type="number" id="number" value="100" oninput="window.testInput && window.testInput()"><p id="inputResult">反映結果：未確認</p></div><div class="panel"><button onclick="document.getElementById('plainResult').textContent='HTMLの直接操作は成功'">HTMLだけのテスト</button><p id="plainResult">未実行</p></div><div class="panel"><b>診断ログ</b><pre id="log">スクリプト実行待ち</pre></div><p>②が「未実行」のままなら、ファイルを開いているアプリ側がJavaScriptを実行していない可能性があります。</p><script>var log=document.getElementById('log');function report(s){log.textContent+='\n'+s;}document.getElementById('jsStatus').textContent='成功';document.getElementById('jsStatus').className='ok';log.textContent='JavaScriptが実行されました';window.testClick=function(){document.getElementById('clickResult').textContent='押した結果：成功！';report('ボタン：成功')};window.testInput=function(){document.getElementById('inputResult').textContent='反映結果：'+document.getElementById('number').value;report('入力：成功')};document.getElementById('loadStatus').textContent='スクリプト到達済み';document.getElementById('loadStatus').className='ok';window.addEventListener('load',function(){document.getElementById('loadStatus').textContent='読み込み完了';report('loadイベント：成功')});window.onerror=function(msg,src,line){report('エラー：'+msg+' 行：'+line)};</script></body></html>
